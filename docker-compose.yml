services:
  hostaggr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostaggr
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-30}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-10}
      - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES:-1}
      - PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT_SECONDS:-2}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
